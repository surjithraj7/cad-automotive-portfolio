services:
  - type: web
    name: surjith-cad-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /assets/*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
